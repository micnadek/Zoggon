name: Buduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Testy gry
        run: node --test

      - name: Skopiuj grę do aplikacji
        run: |
          W=android/app/src/main/assets/www
          mkdir -p $W
          cp -r index.html manifest.webmanifest icon.svg icon-192.png icon-512.png js $W/

      - name: Zbuduj APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Przygotuj plik
        run: cp android/app/build/outputs/apk/release/app-release.apk Zoggon2026.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zoggon2026-apk
          path: Zoggon2026.apk

      - name: Opublikuj w Releases
        uses: ncipollo/release-action@v1
        with:
          tag: apk
          name: Zoggon 2026 – APK (najnowszy)
          body: "Najnowsza wersja gry na Androida, build #${{ github.run_number }}. Pobierz Zoggon2026.apk na telefonie i zainstaluj."
          artifacts: Zoggon2026.apk
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          commit: ${{ github.sha }}
